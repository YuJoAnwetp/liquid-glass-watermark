      if (scrim[3] > 1e-3) {
        gl.enable(gl.BLEND);
        gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      }
      this.bindFBO(this.blurFboA);
      this.drawColorControls(this.dialogBackdropTex, brightness, contrast, saturation);
      this.bindFBO(this.dialogBackdropFbo);
      this.drawCopy(this.blurFboATex);
    }
  };

  // engine-src/components/liquid-glass/renderer/methods-render-nonglass.ts
  var nonGlassMethods = {
    /** Render a non-glass element (plain-rect / progressive-blur / text).
     *  Returns true if the element was handled (caller should `continue`).
     *  Returns false for glass elements (caller should run the ping-pong path).
     *
     *  Extracted verbatim from methods-render.ts — only the dispatcher /
     *  branch-routing glue lives here; each branch's body was moved to its
     *  own methods-render-nonglass-*.ts module. */
    renderNonGlassElement(el, r, st, curFbo) {
      let r2 = r;
      if (el.enterProgress != null) {
        const raw = el.enterProgress;
        const derived = raw < 0 ? (1 - Math.exp(-Math.abs(raw))) * -1 : raw <= 1 ? raw : 1 + (1 - Math.exp(-(raw - 1)));
        const ty = -48 * DP * (1 - derived);
        const stretch = el.enterStretchFactor != null && derived > 1 ? el.enterStretchFactor * (derived - 1) * 32 * DP : 0;
        r2 = { x: r.x, y: r.y + ty + stretch, w: r.w, h: r.h };
      }
      if (el.kind === "plain-rect" && el.plainRect) {
        return this.renderPlainRectElement(el, r, r2, curFbo);
      }
      if (el.kind === "progressive-blur" && el.progressiveBlur) {
        return this.renderProgressiveBlurElement(el, r2, curFbo);
      }
      if (el.kind === "text") {
        return this.renderTextElement(el, r2, st, curFbo);
      }
      return false;
    }
  };

  // engine-src/components/liquid-glass/renderer/methods-render-diagnose.ts
  function diagnosePlainRect(skipped, skipReason, finalAlpha, w, h, blendEnabled) {
    if (skipped) return { verdict: "SKIPPED", detail: skipReason ?? "unknown" };
    if (!isFinite(finalAlpha) || finalAlpha <= 0) {
      return { verdict: "INVISIBLE", detail: `finalAlpha=${finalAlpha} (colorA*enterA)` };
    }
    if (w <= 0 || h <= 0) {
      return { verdict: "DEGENERATE", detail: `rect ${w.toFixed(1)}x${h.toFixed(1)} \u2264 0` };
    }
    if (!blendEnabled) {
      return { verdict: "NO_OP", detail: "BLEND disabled by prior element" };
    }
    return { verdict: "OK", detail: `finalAlpha=${finalAlpha.toFixed(3)}` };
  }

  // engine-src/components/liquid-glass/renderer/methods-render-nonglass-plain-rect.ts
  var nonGlassPlainRectMethods = {
    /** plain-rect branch of renderNonGlassElement — see interface doc above.
     *  Extracted verbatim from methods-render.ts. */
    renderPlainRectElement(el, r, r2, curFbo) {
      const gl = this.gl;
      const baseC = el.isToggleTrack ? null : el.plainRect.color;
      if (baseC && baseC[3] <= 0) {
        if (this.showPlainRectDebug && curFbo !== this.bgOnlyFbo) {
          const col = el.plainRect.color;
          const sp0 = el.enterSafeProgress != null ? Math.max(0, Math.min(1, el.enterSafeProgress)) : el.enterProgress != null ? Math.max(0, Math.min(1, el.enterProgress)) : 1;
          const ea = el.enterProgress != null ? easeIn(sp0) : 1;
          const fa = col[3] * ea;
          const blendOn = this.gl.isEnabled(this.gl.BLEND);
          const reason = `color alpha=${col[3]} \u2264 0`;
          const dg = diagnosePlainRect(true, reason, fa, r2.w, r2.h, blendOn);
          this.debugPlainRects.push({
            id: el.id,
            x: r2.x,
            y: r2.y,
            w: r2.w,
            h: r2.h,
            origH: el.rect.h,
            colorR: col[0],
            colorG: col[1],
            colorB: col[2],
            colorA: col[3],
            enterProgress: el.enterProgress ?? null,
            enterSafeProgress: el.enterSafeProgress ?? null,
            enterA: ea,
            finalAlpha: fa,
            skipped: true,
            skipReason: reason,
            drawn: false,
            blendEnabled: blendOn,
            curFboIsA: curFbo === this.fboA,
            diagnosis: dg.verdict,
            diagnosisDetail: dg.detail
          });
        }
        return true;
      }
      this.bindFBO(curFbo);
      let clipEnabled = false;
      if (el.clipRect) {
        const cx0 = Math.max(0, Math.round(r2.x * this.dpr));
        const cy0 = Math.max(0, Math.round((this.cssHeight - (r2.y + r2.h)) * this.dpr));
        const cw = Math.min(this.fboW - cx0, Math.round(r2.w * this.dpr));
        const ch = Math.min(this.fboH - cy0, Math.round(r2.h * this.dpr));
        const clip = this.intersectClipScissor(el, cx0, cy0, cw, ch);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(clip.x, clip.y, clip.w, clip.h);
        clipEnabled = true;
      }
      let c;
      if (el.isToggleTrack) {
        const tg = this.toggleStates.get(el.isToggleTrack.groupId);
        const f = tg ? tg.fraction : 0;
        const off = el.isToggleTrack.offColor;
        const on = el.isToggleTrack.onColor;
        c = [
          off[0] + (on[0] - off[0]) * f,

    const { el, st, isButton, p, sx, sy, sw, sh, radii, togglePressProgress } = state;
    const origSizeX = state.origW * renderer.dpr;
    const origSizeY = state.origH * renderer.dpr;
    const origRadius = state.origCornerRadius * renderer.dpr;
    const layerScaleX = state.layerScaleX;
    const layerScaleY = state.layerScaleY;
    const bindTintContinuousSdf = () => {
      if (el.useContinuousSdf && renderer.continuousSdfTexture) {
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, renderer.continuousSdfTexture);
        gl.uniform1i(renderer.uTn["uContinuousSdf"], 2);
        gl.uniform1f(renderer.uTn["uUseContinuousSdf"], 1);
        gl.uniform2f(
          renderer.uTn["uContinuousSdfTexSize"],
          renderer.continuousSdfTexSize[0],
          renderer.continuousSdfTexSize[1]
        );
        gl.uniform2f(
          renderer.uTn["uContinuousSdfElementSize"],
          state.origW * renderer.dpr,
          state.origH * renderer.dpr
        );
      } else {
        gl.uniform1f(renderer.uTn["uUseContinuousSdf"], 0);
      }
    };
    const isContainer = !!el.isBottomTabContainer;
    const glowP = isButton ? p : isContainer ? togglePressProgress : 0;
    if (isButton && el.isInteractive && st && p > 1e-3 || isContainer && togglePressProgress > 1e-3) {
      gl.useProgram(renderer.tintProgram);
      gl.bindBuffer(gl.ARRAY_BUFFER, renderer.quadBuffer);
      gl.enableVertexAttribArray(renderer.aPosLocTn);
      gl.vertexAttribPointer(renderer.aPosLocTn, 2, gl.FLOAT, false, 0, 0);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.uniform2f(renderer.uTn["uCanvasSize"], renderer.canvas.width, renderer.canvas.height);
      gl.uniform2f(renderer.uTn["uOffset"], sx * renderer.dpr, sy * renderer.dpr);
      gl.uniform2f(renderer.uTn["uSize"], sw * renderer.dpr, sh * renderer.dpr);
      gl.uniform4f(
        renderer.uTn["uCornerRadii"],
        radii[0] * renderer.dpr,
        radii[1] * renderer.dpr,
        radii[2] * renderer.dpr,
        radii[3] * renderer.dpr
      );
      gl.uniform2f(renderer.uTn["uOriginalSize"], origSizeX, origSizeY);
      gl.uniform1f(renderer.uTn["uOriginalCornerRadius"], origRadius);
      gl.uniform2f(renderer.uTn["uLayerScale"], layerScaleX, layerScaleY);
      gl.uniform1f(renderer.uTn["uElementRotation"], state.elementRotation);
      gl.uniform1f(renderer.uTn["uCornerStyle"], renderer.cornerStyle);
      bindTintContinuousSdf();
      gl.uniform4f(renderer.uTn["uColor"], 1, 1, 1, 0.08 * glowP);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      gl.useProgram(renderer.highlightProgram);
      gl.bindBuffer(gl.ARRAY_BUFFER, renderer.quadBuffer);
      gl.enableVertexAttribArray(renderer.aPosLocHl);
      gl.vertexAttribPointer(renderer.aPosLocHl, 2, gl.FLOAT, false, 0, 0);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.uniform2f(renderer.uHl["uCanvasSize"], renderer.canvas.width, renderer.canvas.height);
      gl.uniform2f(renderer.uHl["uOffset"], sx * renderer.dpr, sy * renderer.dpr);
      gl.uniform2f(renderer.uHl["uSize"], sw * renderer.dpr, sh * renderer.dpr);
      gl.uniform4f(
        renderer.uHl["uCornerRadii"],
        radii[0] * renderer.dpr,
        radii[1] * renderer.dpr,
        radii[2] * renderer.dpr,
        radii[3] * renderer.dpr
      );
      gl.uniform2f(renderer.uHl["uOriginalSize"], origSizeX, origSizeY);
      gl.uniform1f(renderer.uHl["uOriginalCornerRadius"], origRadius);
      gl.uniform2f(renderer.uHl["uLayerScale"], layerScaleX, layerScaleY);
      gl.uniform1f(renderer.uHl["uElementRotation"], state.elementRotation);
      gl.uniform1f(renderer.uHl["uCornerStyle"], renderer.cornerStyle);
      gl.uniform4f(renderer.uHl["uColor"], 1, 1, 1, 0.15 * glowP);
      const minDim = Math.min(sw, sh) * renderer.dpr;
      gl.uniform1f(renderer.uHl["uRadius"], minDim * 1.5);
      let px, py;
      if (isContainer) {
        const tg = renderer.toggleStates.get(el.isBottomTabContainer.groupId);
        const tabsCount = el.isBottomTabContainer.tabsCount ?? 4;
        const tabW = el.rect.w / tabsCount;
        const fraction = tg ? tg.fraction : 0;
        const indCenterX = (fraction + 0.5) * tabW;
        const scaleToLocal = sw / el.rect.w;
        px = Math.max(0, Math.min(sw, indCenterX * scaleToLocal)) * renderer.dpr;
        py = sh / 2 * renderer.dpr;
      } else {
        px = Math.max(0, Math.min(sw, st.dragX * state.layerScaleX)) * renderer.dpr;
        py = Math.max(0, Math.min(sh, st.dragY * state.layerScaleY)) * renderer.dpr;
      }
      gl.uniform2f(renderer.uHl["uPosition"], px, py);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    }
    if (el.isToggleKnob && togglePressProgress < 0.999) {
      const whiteAlpha = 1 * (1 - togglePressProgress);
      gl.useProgram(renderer.tintProgram);
      gl.bindBuffer(gl.ARRAY_BUFFER, renderer.quadBuffer);
      gl.enableVertexAttribArray(renderer.aPosLocTn);
      gl.vertexAttribPointer(renderer.aPosLocTn, 2, gl.FLOAT, false, 0, 0);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.uniform2f(renderer.uTn["uCanvasSize"], renderer.canvas.width, renderer.canvas.height);
      gl.uniform2f(renderer.uTn["uOffset"], sx * renderer.dpr, sy * renderer.dpr);
      gl.uniform2f(renderer.uTn["uSize"], sw * renderer.dpr, sh * renderer.dpr);
      gl.uniform4f(
        renderer.uTn["uCornerRadii"],
        radii[0] * renderer.dpr,
        radii[1] * renderer.dpr,
        radii[2] * renderer.dpr,
        radii[3] * renderer.dpr
      );
      gl.uniform2f(renderer.uTn["uOriginalSize"], origSizeX, origSizeY);
      gl.uniform1f(renderer.uTn["uOriginalCornerRadius"], origRadius);
      gl.uniform2f(renderer.uTn["uLayerScale"], layerScaleX, layerScaleY);
      gl.uniform1f(renderer.uTn["uElementRotation"], state.elementRotation);
      gl.uniform1f(renderer.uTn["uCornerStyle"], renderer.cornerStyle);
      bindTintContinuousSdf();
      gl.uniform4f(renderer.uTn["uColor"], 1, 1, 1, whiteAlpha);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
    if (el.isBottomTabIndicator && el.isBottomTabIndicator.dimColor) {
      const dc = el.isBottomTabIndicator.dimColor;
      const prog = togglePressProgress;
      gl.useProgram(renderer.tintProgram);
      gl.bindBuffer(gl.ARRAY_BUFFER, renderer.quadBuffer);
      gl.enableVertexAttribArray(renderer.aPosLocTn);
      gl.vertexAttribPointer(renderer.aPosLocTn, 2, gl.FLOAT, false, 0, 0);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.uniform2f(renderer.uTn["uCanvasSize"], renderer.canvas.width, renderer.canvas.height);
      gl.uniform2f(renderer.uTn["uOffset"], sx * renderer.dpr, sy * renderer.dpr);
      gl.uniform2f(renderer.uTn["uSize"], sw * renderer.dpr, sh * renderer.dpr);
      gl.uniform4f(
        renderer.uTn["uCornerRadii"],
        radii[0] * renderer.dpr,
        radii[1] * renderer.dpr,
        radii[2] * renderer.dpr,
        radii[3] * renderer.dpr
      );
      gl.uniform2f(renderer.uTn["uOriginalSize"], origSizeX, origSizeY);
      gl.uniform1f(renderer.uTn["uOriginalCornerRadius"], origRadius);
      gl.uniform2f(renderer.uTn["uLayerScale"], layerScaleX, layerScaleY);
      gl.uniform1f(renderer.uTn["uElementRotation"], state.elementRotation);
      gl.uniform1f(renderer.uTn["uCornerStyle"], renderer.cornerStyle);
      bindTintContinuousSdf();
      gl.uniform4f(renderer.uTn["uColor"], dc[0], dc[1], dc[2], 0.1 * (1 - prog));
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      gl.uniform4f(renderer.uTn["uColor"], 0, 0, 0, 0.03 * prog);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    }
  }

  // engine-src/components/liquid-glass/renderer/methods-render-glass-post-passes-rim-highlight.ts
  function renderGlassRimHighlight(renderer, state) {
    const gl = renderer.gl;
    const { el, sx, sy, sw, sh, radii, togglePressProgress, elHighlightAlpha } = state;
    if (!el.highlight || el.highlight.alpha <= 1e-3 || !renderer.quickToggles.highlight) return;
    const origSizeX = state.origW * renderer.dpr;
    const origSizeY = state.origH * renderer.dpr;
    const origRadius = state.origCornerRadius * renderer.dpr;
    const layerScaleX = state.layerScaleX;
    const layerScaleY = state.layerScaleY;
    const rimAlpha = el.isToggleKnob || el.isBottomTabIndicator ? elHighlightAlpha : el.highlight.alpha;
    const paintAlpha = el.highlight.mode === 1 ? 0.38 : 1;
    const finalAlpha = rimAlpha * state.enterAlpha * paintAlpha;
    if (finalAlpha <= 1e-3) return;
    const widthPx = Math.min(
      el.highlight.widthDp * renderer.dpr,
      Math.min(origSizeX, origSizeY) * 0.5
    );
    const strokeWidthDevice = el.highlight.aa !== false ? Math.max(1, Math.ceil(widthPx) * 2) : Math.max(1, Math.round(widthPx) * 2);
    const blurPx = Math.max(0, (el.highlight.blurRadiusDp ?? el.highlight.widthDp / 2) * renderer.dpr);
    const strokeMargin = Math.ceil(strokeWidthDevice) + 4;
    const maskW = Math.max(1, Math.ceil(origSizeX + 2 * strokeMargin));
    const maskH = Math.max(1, Math.ceil(origSizeY + 2 * strokeMargin));
    const deviceDpr = window.devicePixelRatio || 1;
    const SS = Math.min(2, Math.max(1, Math.floor(deviceDpr / renderer.dpr)));
    const canvasW = maskW * SS;
    const canvasH = maskH * SS;
    const useG2 = !!el.useContinuousSdf;
    const maskKey = [
      useG2 ? "g2" : "rr",
      origSizeX.toFixed(3),
      origSizeY.toFixed(3),
      origRadius.toFixed(3),
      strokeWidthDevice,
      blurPx.toFixed(3),
      strokeMargin,
      maskW,
      maskH,
      `ss${SS}`
      // cache key includes supersample factor
    ].join(":");
    let mask = renderer.strokeMaskCache.get(maskKey);
    if (!mask) {
      const canvas = document.createElement("canvas");
      canvas.width = canvasW;
      canvas.height = canvasH;
      const ctx2d = canvas.getContext("2d", { alpha: true });
      if (!ctx2d) throw new Error("2D canvas not supported");
      const tex = gl.createTexture();
      if (!tex) throw new Error("WebGL texture allocation failed");
      mask = { tex, canvas, ctx: ctx2d, w: maskW, h: maskH, ready: false };
      renderer.strokeMaskCache.set(maskKey, mask);
      if (renderer.strokeMaskCache.size > 32) {
        const oldestKey = renderer.strokeMaskCache.keys().next().value;
        if (oldestKey && oldestKey !== maskKey) {
          const oldest = renderer.strokeMaskCache.get(oldestKey);
          if (oldest) gl.deleteTexture(oldest.tex);
          renderer.strokeMaskCache.delete(oldestKey);
        }
      }
    }
    if (!mask.ready) {
      const smCtx = mask.ctx;
      smCtx.clearRect(0, 0, canvasW, canvasH);
      smCtx.save();
      smCtx.scale(SS, SS);
      smCtx.translate(strokeMargin, strokeMargin);
      let path;
      if (useG2) {
        path = continuousCurvatureRoundedRectPath(smCtx, origSizeX, origSizeY, origRadius);
      } else {
        path = new Path2D();
        const r = Math.min(origRadius, origSizeX / 2, origSizeY / 2);
        path.moveTo(r, 0);
        path.lineTo(origSizeX - r, 0);
        path.arcTo(origSizeX, 0, origSizeX, r, r);
        path.lineTo(origSizeX, origSizeY - r);
        path.arcTo(origSizeX, origSizeY, origSizeX - r, origSizeY, r);
        path.lineTo(r, origSizeY);
        path.arcTo(0, origSizeY, 0, origSizeY - r, r);
        path.lineTo(0, r);
        path.arcTo(0, 0, r, 0, r);
        path.closePath();
      }
      smCtx.clip(path);
      smCtx.lineWidth = strokeWidthDevice;
      smCtx.strokeStyle = "rgba(255,255,255,1)";
      smCtx.lineJoin = "round";
      smCtx.lineCap = "round";
      smCtx.filter = blurPx > 0.01 ? `blur(${blurPx}px)` : "none";
      smCtx.stroke(path);
      smCtx.filter = "none";
      smCtx.restore();
      gl.bindTexture(gl.TEXTURE_2D, mask.tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mask.canvas);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      mask.ready = true;
    }
    gl.enable(gl.BLEND);
    if (el.highlight.mode === 1) {
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    } else {
      gl.blendFunc(gl.ONE, gl.ONE);
    }
    gl.useProgram(renderer.strokeMaskCompositeProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, renderer.quadBuffer);
    gl.enableVertexAttribArray(renderer.aPosLocSm);
    gl.vertexAttribPointer(renderer.aPosLocSm, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(renderer.uSm["uCanvasSize"], renderer.canvas.width, renderer.canvas.height);
    gl.uniform2f(renderer.uSm["uOffset"], sx * renderer.dpr, sy * renderer.dpr);
    gl.uniform2f(renderer.uSm["uSize"], sw * renderer.dpr, sh * renderer.dpr);
    gl.uniform4f(
      renderer.uSm["uCornerRadii"],
      radii[0] * renderer.dpr,
      radii[1] * renderer.dpr,
      radii[2] * renderer.dpr,
      radii[3] * renderer.dpr
    );
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, mask.tex);
    gl.uniform1i(renderer.uSm["uStrokeMask"], 0);
    gl.uniform2f(renderer.uSm["uMaskOffset"], strokeMargin, strokeMargin);
    gl.uniform2f(renderer.uSm["uMaskSize"], mask.w, mask.h);
    gl.uniform4f(
      renderer.uSm["uHighlightColor"],
      el.highlight.color[0],
      el.highlight.color[1],
      el.highlight.color[2],
      1
    );
    gl.uniform1f(
      renderer.uSm["uHighlightAngle"],
      el.useGravityAngle ? renderer.gravityAngle : el.highlight.angle
    );
    gl.uniform1f(renderer.uSm["uHighlightFalloff"], el.highlight.falloff);
    gl.uniform1f(renderer.uSm["uHighlightAlpha"], finalAlpha);
    gl.uniform1f(renderer.uSm["uHighlightMode"], el.highlight.mode);
    gl.uniform2f(renderer.uSm["uOriginalSize"], origSizeX, origSizeY);
    gl.uniform1f(renderer.uSm["uOriginalCornerRadius"], origRadius);
    gl.uniform2f(renderer.uSm["uLayerScale"], layerScaleX, layerScaleY);
    gl.uniform1f(renderer.uSm["uElementRotation"], state.elementRotation);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }

  // engine-src/components/liquid-glass/renderer/methods-render-glass-post-passes.ts
  var glassPostPassMethods = {
    /** Steps 2b–2f: Inner shadow, press glow, white overlay, foreground, rim highlight.
     *  These all composite on top of the glass body (already drawn to
     *  otherFbo by renderGlassElementPass).
     *
     *  Orchestration only — the inner-shadow pass, the press-glow + white-overlay
     *  + indicator-dim overlays, and the rim-highlight pass each live in their
     *  own file. Only the foreground (label/icon) pass is small enough to keep
     *  inline here. */
    renderGlassPostPasses(state) {
      const gl = this.gl;
      const { el, st, isButton, p, sx, sy, sw, sh, radii } = state;
      const origSizeX = state.origW * this.dpr;
      const origSizeY = state.origH * this.dpr;
      const origRadius = state.origCornerRadius * this.dpr;
      const layerScaleX = state.layerScaleX;
      const layerScaleY = state.layerScaleY;
      renderGlassInnerShadowPass(this, state);
      renderGlassGlowAndOverlays(this, state);
      if (isButton && (el.label || el.icon)) {
        const fgTex = this.fgTextures.get(el.id);
        if (fgTex) {
          gl.useProgram(this.foregroundProgram);
          gl.bindBuffer(gl.ARRAY_BUFFER, this.quadBuffer);
          gl.enableVertexAttribArray(this.aPosLocFg);
          gl.vertexAttribPointer(this.aPosLocFg, 2, gl.FLOAT, false, 0, 0);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, fgTex);
          gl.uniform1i(this.uFg["uTexture"], 0);
          gl.uniform2f(this.uFg["uCanvasSize"], this.canvas.width, this.canvas.height);
          gl.uniform2f(this.uFg["uOffset"], sx * this.dpr, sy * this.dpr);
          gl.uniform2f(this.uFg["uSize"], sw * this.dpr, sh * this.dpr);
          gl.uniform4f(
            this.uFg["uCornerRadii"],
            radii[0] * this.dpr,
            radii[1] * this.dpr,
            radii[2] * this.dpr,
            radii[3] * this.dpr
          );
          gl.uniform2f(this.uFg["uOriginalSize"], origSizeX, origSizeY);
          gl.uniform1f(this.uFg["uOriginalCornerRadius"], origRadius);
          gl.uniform2f(this.uFg["uLayerScale"], layerScaleX, layerScaleY);
          gl.uniform1f(this.uFg["uCornerStyle"], this.cornerStyle);
          if (el.useContinuousSdf && this.continuousSdfTexture) {
            gl.activeTexture(gl.TEXTURE2);
            gl.bindTexture(gl.TEXTURE_2D, this.continuousSdfTexture);
            gl.uniform1i(this.uFg["uContinuousSdf"], 2);
            gl.uniform1f(this.uFg["uUseContinuousSdf"], 1);
            gl.uniform2f(
              this.uFg["uContinuousSdfTexSize"],
              this.continuousSdfTexSize[0],
              this.continuousSdfTexSize[1]
            );
            gl.uniform2f(
              this.uFg["uContinuousSdfElementSize"],
              state.origW * this.dpr,
              state.origH * this.dpr
            );
          } else {
            gl.uniform1f(this.uFg["uUseContinuousSdf"], 0);
          }
          gl.uniform1f(this.uFg["uAlpha"], 1 - 0.15 * p);
          gl.drawArrays(gl.TRIANGLES, 0, 6);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        }
      }
      renderGlassRimHighlight(this, state);
    }
  };

  // engine-src/components/liquid-glass/renderer/methods-dirty.ts
  var dirtyTrackingMethods = {
    markElementDirty(id) {
      this.dirtyElementIds.add(id);
      const entry = this.elFboCache.get(id);
      if (entry) entry.valid = false;
      if (this.showDirtyMarkers) {
        const stack = new Error().stack ?? "";
        const lines = stack.split("\n");
        let source = "unknown";
        for (let i = 2; i < lines.length; i++) {
          const ln = lines[i].trim();
          if (!ln) continue;
          if (ln.includes("markElementDirty") || ln.includes("markGroupDirty") || ln.includes("markAllDirty")) continue;
          const m = ln.match(/at\s+(\S+)\s+\(/);
          source = m ? m[1] : ln.slice(0, 60);
          break;
        }
        this.debugDirtySourceLog.push({ id, source });
      }
    },
    markAllDirty() {
      this.allDirty = true;
      this.dirtyElementIds.clear();
      for (const entry of this.elFboCache.values()) entry.valid = false;
    },
    markGroupDirty(groupId) {
      for (const el of this.buttonConfigs) {
        if (el.isToggleKnob?.groupId === groupId || el.isToggleTrack?.groupId === groupId || el.isSliderFill?.groupId === groupId || el.isBottomTabContainer?.groupId === groupId || el.isBottomTabContent?.groupId === groupId || el.isBottomTabIndicator?.groupId === groupId) {
          this.markElementDirty(el.id);
        }
      }
    },
    markGravityDirty() {
      for (const el of this.buttonConfigs) {
        if (el.useGravityAngle) this.markElementDirty(el.id);
      }
    },
    hasDirtyElements() {
      return this.allDirty || this.dirtyElementIds.size > 0;
    },
    deleteElFboCacheEntry(id) {
      const entry = this.elFboCache.get(id);
      if (!entry) return;
      const gl = this.gl;
      gl.deleteFramebuffer(entry.fb);
      gl.deleteTexture(entry.tex);
      this.elFboCache.delete(id);
    }
  };

  // engine-src/components/liquid-glass/renderer/methods-debug.ts
  function analyzeEdgeScan(scan) {
    const { pixels, dpr } = scan;
    const N = pixels.length;
    if (N < 4) {
      return {
        edgeIdx: 0,
        edgeOffsetCss: 0,
        transitionHalfW: 0,
        rgbInside: 0,
        rgbOutside: 0,
        minRgbInTransition: 0,
        blackFringeDetected: false,
        hasNearBlackPx: false,
        canvasOpaque: true,
        verdict: "Scan too short (element not found or off-screen)."
      };
    }
    const lum = new Float32Array(N);
    let opaqueCount = 0;
    for (let i = 0; i < N; i++) {
      const p = pixels[i];
      lum[i] = 0.299 * p.r + 0.587 * p.g + 0.114 * p.b;
      if (p.a >= 250) opaqueCount++;
    }
    const canvasOpaque = opaqueCount > N * 0.9;
    let maxGrad = 0;
    let edgeIdx = Math.floor(N / 2);
    for (let i = 2; i < N - 2; i++) {
      const g = Math.abs(lum[i + 1] - lum[i - 1]);
      if (g > maxGrad) {
        maxGrad = g;
        edgeIdx = i;
      }
    }
    const edgeOffsetCss = pixels[edgeIdx].offset;
    const transitionHalfW = Math.max(3, Math.floor(N / 8));
    const zoneStart = Math.max(0, edgeIdx - transitionHalfW);
    const zoneEnd = Math.min(N - 1, edgeIdx + transitionHalfW);
    const insideStart = Math.max(0, zoneStart - 3);
    const insideEnd = Math.max(insideStart, zoneStart - 1);
    let rgbInside = 0, insideCount = 0;
    for (let i = insideStart; i <= insideEnd; i++) {
      rgbInside += lum[i];
      insideCount++;
    }
    rgbInside = insideCount > 0 ? rgbInside / insideCount : lum[0];
    const outsideStart = Math.min(N - 1, zoneEnd + 1);
    const outsideEnd = Math.min(N - 1, zoneEnd + 3);
    let rgbOutside = 0, outsideCount = 0;
    for (let i = outsideStart; i <= outsideEnd; i++) {
      rgbOutside += lum[i];
      outsideCount++;
    }
    rgbOutside = outsideCount > 0 ? rgbOutside / outsideCount : lum[N - 1];
    let minRgbInTransition = 255;
    let hasNearBlackPx = false;
    for (let i = zoneStart; i <= zoneEnd; i++) {
      const l = lum[i];

    if(d)setCustomLogo(d,true);
  }catch(e){}
}

/* ============================== 玻璃数学（移植自参考实现） ============================== */
function sdRound(px,py,hx,hy,r){
  const qx=Math.abs(px)-(hx-r),qy=Math.abs(py)-(hy-r);
  return (Math.hypot(Math.max(qx,0),Math.max(qy,0))-r)+Math.min(Math.max(qx,qy),0);
}
function gradRound(px,py,hx,hy,r){
  const qx=Math.abs(px)-(hx-r),qy=Math.abs(py)-(hy-r);
  if(qx>=0||qy>=0){
    const vx=Math.max(qx,0),vy=Math.max(qy,0),len=Math.hypot(vx,vy);
    if(len<1e-6)return[0,0];
    return[Math.sign(px)*vx/len,Math.sign(py)*vy/len];
  }
  const gx=qy<=qx?1:0;
  return[Math.sign(px)*gx,Math.sign(py)*(1-gx)];
}
function circleMap(x){return 1-Math.sqrt(Math.max(0,1-x*x));}
function sstep(e0,e1,x){const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
function smoothAA(x){return x<=0?0:x>=1?1:x*x*(3-2*x);}
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d>0){if(mx===r){h=((g-b)/d)%6;}else if(mx===g){h=(b-r)/d+2;}else{h=(r-g)/d+4;}h*=60;if(h<0)h+=360;}
  return[h,mx?d/mx:0,mx];
}
function hsv2rgb(h,s,v){
  const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[(r+m)*255,(g+m)*255,(b+m)*255];

function blendHue(r,g,b,tr,tg,tb){
  const h1=rgb2hsv(r,g,b),h2=rgb2hsv(tr,tg,tb);
  return hsv2rgb(h2[0],h1[1],h1[2]);
}
function hexToRgb(hex){
  const n=parseInt(hex.slice(1),16);
  return[(n>>16)&255,(n>>8)&255,n&255];
}

/* ============================== 布局 ============================== */
const layoutCtx=document.createElement('canvas').getContext('2d');
function layoutWatermark(W,H){
  const fs=Math.max(9,state.fontScale*W*0.030);
  const L={fs:fs};
  const brand=findBrand();
  const hasT1=!!state.text1.trim(),hasT2=!!state.text2.trim();
  L.hasT1=hasT1;L.hasT2=hasT2;
  const gap=fs*.55;L.gap=gap;
  let logoW=0;const logoH=fs*1.02;L.logoH=logoH;
  if(brand){logoW=brand.draw(layoutCtx,logoH,'#fff');}
  L.logoW=logoW;
  layoutCtx.font=state.weight+' '+fs+'px '+FONT_SANS;
  const tw1=hasT1?layoutCtx.measureText(state.text1).width:0;
  layoutCtx.font='500 '+(fs*.62)+'px '+FONT_SANS;
  const tw2=hasT2?layoutCtx.measureText(state.text2).width:0;
  const textW=Math.max(tw1,tw2);
  const hasText=hasT1||hasT2;
  const contentW=(brand?logoW+(hasText?gap:0):0)+textW;
  const line2H=fs*.8,gapG=fs*.28;
  const contentH=fs*1.16+(hasT2?gapG+line2H:0);
  const padX=fs*.85,padY=fs*.62;
  L.pw=Math.max(fs*1.2,contentW+padX*2);
  L.ph=contentH+padY*2;
  L.radius=Math.min(state.radius*Math.min(L.pw,L.ph)/2,Math.min(L.pw,L.ph)/2);
  const rot=state.rotation*Math.PI/180;L.rot=rot;
  const cos=Math.cos(rot),sin=Math.sin(rot);
  const ex=(Math.abs(cos)*L.pw+Math.abs(sin)*L.ph)/2,ey=(Math.abs(sin)*L.pw+Math.abs(cos)*L.ph)/2;
  const m=state.margin*Math.min(W,H);
  const parts=state.anchor.split('-');
  const ax=parts[1]==='left'?m+ex:(parts[1]==='right'?W-m-ex:W/2);
  const ay=parts[0]==='top'?m+ey:(parts[0]==='bottom'?H-m-ey:H/2);
  let cx=ax+state.offX*W,cy=ay+state.offY*H;
  const lox=Math.min(ex,W-ex),hix=Math.max(ex,W-ex);
  cx=lox<=hix?Math.min(hix,Math.max(lox,cx)):W/2;
  const loy=Math.min(ey,H-ey),hiy=Math.max(ey,H-ey);
  cy=loy<=hiy?Math.min(hiy,Math.max(loy,cy)):H/2;
  L.cx=cx;L.cy=cy;L.contentW=contentW;L.contentH=contentH;L.line2H=line2H;L.gapG=gapG;
  return L;
}

/* ============================== 渲染管线 ============================== */
function drawWatermark(ctx,W,H){
  const brand=findBrand();
  if(!brand&&!state.text1.trim()&&!state.text2.trim())return null;
  const L=layoutWatermark(W,H);
  if(L.pw>W*1.9||L.ph>H*1.9)return L;
  renderGlass(ctx,W,H,L);
  return L;
}
function sampleIdx(px,py,rw,rh){
  px=Math.round(px);py=Math.round(py);
  if(px<0)px=0;else if(px>=rw)px=rw-1;
  if(py<0)py=0;else if(py>=rh)py=rh-1;
  return(py*rw+px)*4;
}
function sampleBlur(rd,out,px,py,radius,rw,rh){
  if(radius<0.4){
    const i=sampleIdx(px,py,rw,rh);
    out[0]=rd[i];out[1]=rd[i+1];out[2]=rd[i+2];out[3]=rd[i+3];
    return;
  }
  let sr=0,sg=0,sb=0,sa=0,n=0;
  const st=radius>4?1.5:radius>2?1:0.75;
  const steps=Math.max(1,Math.ceil(radius/st));
  for(let dy=-steps;dy<=steps;dy++){
    for(let dx=-steps;dx<=steps;dx++){
      const i=sampleIdx(px+dx*st,py+dy*st,rw,rh);
      sr+=rd[i];sg+=rd[i+1];sb+=rd[i+2];sa+=rd[i+3];n++;
    }
  }
  const k=1/n;out[0]=sr*k;out[1]=sg*k;out[2]=sb*k;out[3]=sa*k;
}
/* ===== Kyant 真 WebGL 玻璃引擎桥接：替换 renderGlass 的 Canvas2D 手算折射 =====
   引擎画布=preview 全尺寸，壁纸=原图 stretch(cover-fit 恒等→折射逐像素对齐)，
   玻璃面板画在 (cx,cy)，透明背景只画面板，drawImage 贴回主画布再叠 drawContent。
   只在引擎可用且 rot===0 时走此路径，否则回退下方 Canvas2D 手算。 */
let _ge=null,_geW=0,_geH=0,_geWallSrc='',_geWallKey='',_geWallReady=false,_geFail=0;
function _hexArr(h){const n=parseInt((h||'#ffffff').slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
async function renderGlassEngine(ctx,W,H,L){
  const K=window.KyantGlass;
  if(!K||!srcImage||(state.bgMode||'image')==='none')return false;
  const pw=L.pw,ph=L.ph,cx=L.cx,cy=L.cy;
  if(cx-pw/2<0||cy-ph/2<0||cx+pw/2>W||cy+ph/2>H)return false;   // 面板出界回退
  if(!_ge||_geW!==W||_geH!==H){const c=document.createElement('canvas');c.width=W;c.height=H;_ge=K.createGlassRenderer(c);_geW=W;_geH=H;_geWallReady=false;}
  const blur=Number(state.blur)||0,wallKey=W+'x'+H+'|'+(state.bgMode||'image');   // blur 由引擎 blurRadius 做，不进 key（拖模糊不重建壁纸）
  if(_geWallKey!==wallKey)_geWallReady=false;
  if(!_geWallReady){
    const wc=document.createElement('canvas');wc.width=W;wc.height=H;const wx=wc.getContext('2d');
    wx.drawImage(srcImage,0,0,W,H);
    drawWatermark(wx,W,H);   // 壁纸含水印，玻璃折射背景+水印（同原版）；clearRect 后也已补回
    _geWallSrc=wc.toDataURL('image/jpeg',.9);_geWallKey=wallKey;
    await _ge.loadWallpaper(_geWallSrc);_geWallReady=true;
    requestAnimationFrame(()=>renderPreview());   // 壁纸就绪后重画一次，否则首帧玻璃空白
  }
  _ge.resize(W,H);
  const tc=_hexArr(state.tintC);
  _ge.setElements([K.makeGlassShape('wm',{x:Math.round(cx-pw/2),y:Math.round(cy-ph/2),w:Math.round(pw),h:Math.round(ph)},{
    cornerRadius:Math.max(2,L.radius*Math.min(pw,ph)/2),
    refractionHeight:Math.max(1,state.refrHeight||0),
    refractionAmount:(state.refrAmount||0)*.9,
    blurRadius:Math.min(32,blur*.6),
    saturation:1+(state.tintA||0)*.8,
    chromaticAberration:!!(state.chromaOn&&state.chromaI>0.02),
    surfaceColor:[tc[0],tc[1],tc[2],state.tintA||0],
    highlight:{mode:0,color:[1,1,1],angle:45*Math.PI/180,falloff:1.0,alpha:Math.min(1,(state.highlight||0)*.5),widthDp:0.5}
  })]);
  _ge.render();
  // 只把玻璃面板叠到主画布已有的背景+水印之上（不清屏、不画文字）：
  // renderGlass 已同步画好背景+水印+文字，这里玻璃以 alpha 叠加，文字由外部回调再补一次保持最上
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,state.opacity==null?1:state.opacity));
  ctx.drawImage(_ge.canvas,0,0);ctx.restore();
  return true;
}
function renderGlass(ctx,W,H,L){
  const isOld=(state.style||'new')==='old';
  const{cx,cy,pw,ph,rot}=L;
  const cos=Math.cos(rot),sin=Math.sin(rot);
  const ex=(Math.abs(cos)*pw+Math.abs(sin)*ph)/2,ey=(Math.abs(sin)*pw+Math.abs(cos)*ph)/2;
  // 老样式：忠实复刻原版——仅边缘折射 + 均匀白描边高光，所有新特效归零
  const bulge=isOld?0:(state.bulge||0),wob=isOld?0:(state.wobble||0);
  const bulgeOn=bulge>0.004,wobOn=wob>0.004;
  const bm=state.bgMode||'image';
  const baseBlur=Number(state.blur)||0;
  const blur=bm==='none'?Math.max(baseBlur,1.6):baseBlur;
  const warpMax=(bulgeOn||wobOn)?(Math.max(bulge,bulgeOn?.4:0)*L.fs*.16+(wobOn?wob*L.fs*.09:0)):0;
  const pad=Math.min(340,blur*2+L.fs*.16+warpMax+Math.abs(state.refrAmount||0)*.08+Math.abs(state.rimRef||0)*.9+30);
  let rx=Math.floor(cx-ex-pad),ry=Math.floor(cy-ey-pad);
  let rw=Math.ceil(2*(ex+pad)),rh=Math.ceil(2*(ey+pad));
  if(rw>W){rx=0;rw=W;}else{rx=Math.max(0,Math.min(rx,W-rw));}
  if(rh>H){ry=0;rh=H;}else{ry=Math.max(0,Math.min(ry,H-rh));}

  const rc=document.createElement('canvas');rc.width=rw;rc.height=rh;
  const r2=rc.getContext('2d',{willReadFrequently:true});
  if(blur>0.3){try{r2.filter='blur('+blur+'px)';}catch(e){}}
  r2.drawImage(ctx.canvas,rx,ry,rw,rh,0,0,rw,rh);
  try{r2.filter='none';}catch(e){}
  const rd=r2.getImageData(0,0,rw,rh).data;

  let lum=0,ln=0;
  for(let i=0;i<rd.length;i+=64){lum+=rd[i]*.2126+rd[i+1]*.7152+rd[i+2]*.0722;ln++;}
  lum=ln?lum/(255*ln):0;

  L.effLum=lum+tA*.55*(1-lum);

  // Kyant 真 WebGL 引擎路径：默认关闭（手机 GPU 跑多 pass 模糊+色散太重会卡死）。
  // 仅当设置里显式开启 state._useGlassEngine===true 才走引擎；否则走下方 Canvas2D（不卡、功能全）。
  if(!isOld&&state._useGlassEngine===true&&window.KyantGlass&&(state.bgMode||'image')!=='none'&&_geFail<2){
    renderGlassEngine(ctx,W,H,L).then(ok=>{
      if(ok){
        _geFail=0;
        renderPreview._engOk=true;
        drawWatermark(ctx,W,H);   // 引擎玻璃叠上来后会盖住水印，这里在玻璃之上补画清晰水印
        drawContent(ctx,L);       // 文字/Logo 同样保持在最上层
      }else{
        _geFail++;                // 失败计数，攒够 2 次禁用引擎，打破重画循环
        scheduleRender();
      }
    });
    return;
  }

  const M=2,gw=Math.ceil(pw)+2*M,gh=Math.ceil(ph)+2*M;
  const gc=document.createElement('canvas');gc.width=gw;gc.height=gh;
  const g2=gc.getContext('2d');
  const gImg=g2.createImageData(gw,gh),gd=gImg.data;

  const hx=pw/2,hy=ph/2,R=L.radius;
  const rH=Math.max(state.refrHeight||0,state.edgeBlur||0),rA=state.refrAmount||0;
  const rimRef=state.rimRef||0;
  const rHOn=rH>0.5&&(rA!==0||rimRef>0.01||state.edgeBlur>0);
  const lensI=isOld?0:(state.lens||0),lensOn=lensI>0.004;
  const edgeBlur=isOld?0:(state.edgeBlur||0);
  const gGlow=isOld?0:(state.gGlow||0),gGlowOn=gGlow>0.004;
  // 老样式也保留色散（轻微），仅凸起/波动/透镜/边缘模糊/发光归零

      if(gr){

        if(rimRef>0.01){const d2=-rimRef*(1-circleMap(1+sd/rH))*24;ox+=d2*gr[0];oy+=d2*gr[1];}
        if(rA!==0||rimRef>0.01)didWarp=true;

        const rr2=(lx*lx+ly*ly)/(diag*diag);
        if(rr2<1){
          prof=circleMap(Math.sqrt(1-rr2));
          if(bulgeOn){
            ox-=lx*bulgeK*prof;oy-=ly*bulgeK*prof;
            didWarp=true;
          }
          if(lensOn){
            ox+=lx*lensI*.55*prof;oy+=ly*lensI*.55*prof;
            didWarp=true;
          }
          if(wobOn){
            const m2=prof*(1-prof)*4;
            if(m2>0.01){
              const nx=lx/hx;
              ox+=Math.sin(nx*5.1+ny*2.3)*wobAmp*m2;
              oy+=Math.sin(ny*4.3-nx*1.7+2.1)*wobAmp*m2;

      const acc=[0,0,0,0,0];

        const nr=Math.min(1,Math.hypot(lx/hx,ly/hy));

          const di=cI*(lx*ly)/(hx*hy)*dMask;
          const dx=ox*di,dy=oy*di;
          const sdx=cos*dx-sin*dy,sdy=sin*dx+cos*dy;
          const i1=sampleIdx(bx+sx+sox+sdx,by+sy+soy+sdy,rw,rh);
          const i2=sampleIdx(bx+sx+sox+sdx*2/3,by+sy+soy+sdy*2/3,rw,rh);
          const i3=sampleIdx(bx+sx+sox+sdx/3,by+sy+soy+sdy/3,rw,rh);
          const i4=sampleIdx(bx+sx+sox,by+sy+soy,rw,rh);
          const i5=sampleIdx(bx+sx+sox-sdx/3,by+sy+soy-sdy/3,rw,rh);
          const i6=sampleIdx(bx+sx+sox-sdx*2/3,by+sy+soy-sdy*2/3,rw,rh);
          const i7=sampleIdx(bx+sx+sox-sdx,by+sy+soy-sdy,rw,rh);
          cr=rd[i1]/3.5+rd[i2]/3.5+rd[i3]/3.5+rd[i7]/7;
          cg=rd[i2+1]/7+rd[i3+1]/3.5+rd[i4+1]/3.5+rd[i5+1]/3.5;
          cb=rd[i5+2]/3+rd[i6+2]/3+rd[i7+2]/3;
          ca=(rd[i1+3]+rd[i2+3]+rd[i3+3]+rd[i4+3]+rd[i5+3]+rd[i6+3]+rd[i7+3])/7;
          chromaOn=true;
        }
      }
      if(chromaOn&&blurR>0.4){
        // 模糊带与色散重叠：按模糊占比连续混合，避免交界突变

        r=acc[0]*(1-w)+cr*w;g=acc[1]*(1-w)+cg*w;b=acc[2]*(1-w)+cb*w;a=acc[3]*(1-w)+ca*w;
      }else if(chromaOn){

      }else{
        sampleBlur(rd,acc,bx+sx+sox,by+sy+soy,blurR,rw,rh);
        r=acc[0];g=acc[1];b=acc[2];a=acc[3];
      }
      const aK=a/255;

        r+= (hb[0]-r)*tA; g+=(hb[1]-g)*tA; b+=(hb[2]-b)*tA;
        r+=(tcol[0]-r)*(.75*tA); g+=(tcol[1]-g)*(.75*tA); b+=(tcol[2]-b)*(.75*tA);

          if(rim>0.01){
            const dirL=grR[0]*LX+grR[1]*LY;
            const rimLit=Math.min(1,rim*Math.max(0,dirL)*1.25);
            r+=(255-r)*rimLit;g+=(255-g)*rimLit;b+=(255-b)*rimLit;
            const shade=rim*Math.max(0,-dirL)*.30;
            r*=(1-shade);g*=(1-shade);b*=(1-shade);
          }
        }
      }
      const idx=(y*gw+x)*4;
      gd[idx]=r;gd[idx+1]=g;gd[idx+2]=b;
      gd[idx+3]=Math.round(edgeAA*op*aK*255);
    }
  }
  g2.putImageData(gImg,0,0);
  ctx.save();
  ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.drawImage(gc,-hx-M,-hy-M);
  drawContent(ctx,L);
  ctx.restore();
}
function drawContent(ctx,L){
  const dark=state.textColor==='dark'||(state.textColor==='auto'&&L.effLum>0.6);
  const tc=dark?[17,18,20]:[255,255,255];
  const x0=-L.contentW/2,yTop=-L.contentH/2;
  const gI=state.textGrad>0.004,gA=Math.min(1,state.textGrad||0);
  const c1=hexToRgb(state.textCol1),c2=hexToRgb(state.textCol2);
  const baseCol=state.textGrad>0.004
    ?'rgb('+Math.round((c1[0]+c2[0])/2)+','+Math.round((c1[1]+c2[1])/2)+','+Math.round((c1[2]+c2[2])/2)+')'
    :'rgb('+tc[0]+','+tc[1]+','+tc[2]+')';
  let x=x0;
  const brand=findBrand();
  if(brand){
    ctx.save();ctx.translate(x,yTop+L.contentH/2);
    brand.draw(ctx,L.logoH,gI?'rgb('+c1[0]+','+c1[1]+','+c1[2]+')':baseCol);
    ctx.restore();x+=L.logoW+L.gap;
  }
  ctx.textAlign='left';ctx.textBaseline='middle';
  const glow=state.textGlow||0;
  if(glow>0.01){
    ctx.shadowColor='rgba('+c1[0]+','+c1[1]+','+c1[2]+','+Math.min(1,glow).toFixed(2)+')';
    ctx.shadowBlur=L.fs*.45*glow;ctx.shadowOffsetY=0;
  }else if(state.textShadow>0.01){
    ctx.shadowColor='rgba(0,0,0,'+(.55*state.textShadow).toFixed(2)+')';
    ctx.shadowBlur=L.fs*.14*state.textShadow;ctx.shadowOffsetY=L.fs*.045*state.textShadow;
  }else{
    ctx.shadowColor=dark?'rgba(255,255,255,.45)':'rgba(0,0,0,.5)';
    ctx.shadowBlur=L.fs*.12;ctx.shadowOffsetY=L.fs*.035;
  }
  const fillStyle=gI?null:baseCol;
  if(L.hasT1){
    ctx.font=state.weight+' '+L.fs+'px '+FONT_SANS;
    if(gI){
      const g=ctx.createLinearGradient(x,yTop,x+L.contentW-(brand?L.logoW+L.gap:0),yTop+L.fs*1.16);
      g.addColorStop(0,'rgba('+c1[0]+','+c1[1]+','+c1[2]+','+gA+')');
      g.addColorStop(1,'rgba('+c2[0]+','+c2[1]+','+c2[2]+','+gA+')');
      ctx.fillStyle=g;
    }else ctx.fillStyle=fillStyle;
    ctx.fillText(state.text1,x,yTop+L.fs*.58);
  }
  if(L.hasT2){
    ctx.font='500 '+(L.fs*.62)+'px '+FONT_SANS;
    if(gI){
      const g=ctx.createLinearGradient(x,yTop,x+L.contentW-(brand?L.logoW+L.gap:0),yTop+L.fs*1.16+L.line2H);
      g.addColorStop(0,'rgba('+c1[0]+','+c1[1]+','+c1[2]+',.85)');
      g.addColorStop(1,'rgba('+c2[0]+','+c2[1]+','+c2[2]+',.85)');
      ctx.fillStyle=g;
    }else{
      ctx.fillStyle=dark?'rgba(17,18,20,.85)':'rgba(255,255,255,.88)';
    }
    ctx.fillText(state.text2,x,yTop+L.fs*1.16+L.gapG+L.line2H/2);
  }
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
}

const preview=$('#preview');
let srcImage=null,srcW=0,srcH=0;
const CANVAS_MAX=1400;

function setSrc(img,w,h){
  srcImage=img;srcW=w;srcH=h;
  $('#dropzone').hidden=true;$('#previewWrap').hidden=false;
  $('#sizeInfo').textContent=w+' × '+h;
  updateExpSize();
  warmGlassEngine();   // 预热引擎+壁纸，避免首帧 _geWallReady=false 全黑
  renderPreview();
}
/* 预热：按 setSrc 的图预建引擎画布+加载壁纸，使首帧 _geWallReady=true 走引擎不空帧 */
async function warmGlassEngine(){
  const K=window.KyantGlass;
  if(!K||!srcImage||(state.bgMode||'image')==='none'){_geWallReady=false;return;}
  const s=Math.min(1,CANVAS_MAX/Math.max(srcW,srcH));
  const W=Math.round(srcW*s),H=Math.round(srcH*s);
  try{
    if(!_ge||_geW!==W||_geH!==H){const c=document.createElement('canvas');c.width=W;c.height=H;_ge=K.createGlassRenderer(c);_geW=W;_geH=H;_geWallReady=false;}
    const wallKey=W+'x'+H+'|'+(state.bgMode||'image');
    if(_geWallKey!==wallKey||!_geWallReady){
      const wc=document.createElement('canvas');wc.width=W;wc.height=H;
      wc.getContext('2d').drawImage(srcImage,0,0,W,H);
      _geWallSrc=wc.toDataURL('image/jpeg',.9);_geWallKey=wallKey;
      await _ge.loadWallpaper(_geWallSrc);_geWallReady=true;
    }
  }catch(e){console.warn('warmGlassEngine',e);_geWallReady=false;}
}
function renderPreview(){
  if(typeof applyPageBg==='function')applyPageBg();
  if(!srcImage)return;
  const s=Math.min(1,CANVAS_MAX/Math.max(srcW,srcH));
  const W=Math.round(srcW*s),H=Math.round(srcH*s);
  if(preview.width!==W)preview.width=W;
  if(preview.height!==H)preview.height=H;
  const ctx=preview.getContext('2d');
  ctx.clearRect(0,0,W,H);
  if((state.bgMode||'image')!=='none')ctx.drawImage(srcImage,0,0,W,H);
  drawWatermark(ctx,W,H);
}
let rafPend=false;
function scheduleRender(){
  if(rafPend)return;rafPend=true;
  requestAnimationFrame(()=>{rafPend=false;renderPreview();saveConfigLocal();});
}
function loadImageBlob(blob){
  if(!blob||!blob.type||blob.type.indexOf('image')!==0)return;
  if(window.createImageBitmap){
    createImageBitmap(blob,{imageOrientation:'from-image'})
      .then(bmp=>setSrc(bmp,bmp.width,bmp.height))
      .catch(()=>fallbackImg(blob));
  }else fallbackImg(blob);
}
function fallbackImg(blob){
  const img=new Image();
  img.onload=()=>setSrc(img,img.naturalWidth,img.naturalHeight);
  img.src=URL.createObjectURL(blob);
}
function makeSample(){
  const c=document.createElement('canvas');c.width=1600;c.height=1000;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1600,1000);
  g.addColorStop(0,'#1a2151');g.addColorStop(.45,'#7b2d8e');g.addColorStop(.8,'#ff7a59');g.addColorStop(1,'#ffc24b');
  x.fillStyle=g;x.fillRect(0,0,1600,1000);
  const blobs=[[300,300,260,'rgba(255,120,180,.55)'],[1200,700,300,'rgba(80,180,255,.5)'],[900,250,180,'rgba(255,220,120,.45)'],[500,800,220,'rgba(120,255,200,.4)']];
  for(const bl of blobs){
    const rg=x.createRadialGradient(bl[0],bl[1],0,bl[0],bl[1],bl[2]);
    rg.addColorStop(0,bl[3]);rg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=rg;x.beginPath();x.arc(bl[0],bl[1],bl[2],0,7);x.fill();
  }
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;
  for(let i=0;i<=16;i++){
    x.beginPath();x.moveTo(i*100,0);x.lineTo(i*100,1000);x.stroke();
    x.beginPath();x.moveTo(0,i*62.5);x.lineTo(1600,i*62.5);x.stroke();
  }
  setSrc(c,1600,1000);
}

function doExport(){
  if(!srcImage){toast(t('uploadFirst'));return;}
  const brand=findBrand();
  if(!brand&&!state.text1.trim()&&!state.text2.trim()){toast(t('needAny'));return;}
  toast(t('exporting'));
  setTimeout(()=>{
    try{
      const c=document.createElement('canvas');c.width=srcW;c.height=srcH;
      const ctx=c.getContext('2d');
      if(state.bgMode==='none'){
        ctx.clearRect(0,0,srcW,srcH);
      }else{
        if(state.fmt==='jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,srcW,srcH);}
        ctx.drawImage(srcImage,0,0,srcW,srcH);
      }
      drawWatermark(ctx,srcW,srcH);
      let mime=state.fmt==='jpeg'?'image/jpeg':state.fmt==='webp'?'image/webp':'image/png';
      c.toBlob(blob=>{
        if(state.fmt==='webp'&&(!blob||blob.type!=='image/webp')){mime='image/png';toast(t('webpNA'));}
        if(!blob){toast(t('exporting'));return;}
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        const d=new Date(),p=n=>String(n).padStart(2,'0');
        const stamp=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
        a.href=url;
        a.download='liquid-glass-'+stamp+'.'+(state.fmt==='jpeg'?'jpg':(blob.type==='image/png'?'png':'webp'));
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
        toast(t('done'));
      },mime,state.fmt==='png'?undefined:state.quality);
    }catch(err){toast('Error: '+err.message);}
  },40);
}

const SLIDER_META={};
function addSlider(parent,k,i18nKey,min,max,st,fmt){
  const row=document.createElement('div');row.className='row lgrow';
  const lab=document.createElement('label');lab.textContent=t(i18nKey);
  const val=document.createElement('span');val.className='val';
  row.appendChild(lab);row.appendChild(val);
  const inp=document.createElement('input');
  inp.type='range';inp.dataset.key=k;inp.min=min;inp.max=max;inp.step=st;
  // 液态玻璃滑块：隐藏原生 input，叠加玻璃轨道 + 球形滑块头
  const wrap=document.createElement('div');wrap.className='lgslider';
  const track=document.createElement('div');track.className='lgtrack';
  const fill=document.createElement('div');fill.className='lgfill';
  track.appendChild(fill);
  const thumb=document.createElement('div');thumb.className='lgthumb';
  wrap.appendChild(track);wrap.appendChild(thumb);
  parent.appendChild(row);parent.appendChild(wrap);parent.appendChild(inp);
  inp.classList.add('native-range');
  const sync=()=>{
    const p=(Number(inp.value)-min)/(max-min);
    const trackW=wrap.clientWidth||200, knobW=40;
    // 忠实 LiquidSlider.kt：knob 左边缘 x = trackX - knobW/4 + p*(trackW - knobW/2)
    const x=-knobW/4 + p*(trackW - knobW/2);
    // fill 宽度 = knobW/4 + p*(trackW - knobW/2)，从 trackX=0 起，对齐 knob 中心
    const fw=knobW/4 + p*(trackW - knobW/2);
    fill.style.width=Math.max(0,fw)+'px';
    thumb.style.left=x+'px';
  };
  inp.addEventListener('input',sync);
  wrap.addEventListener('pointerdown',e=>{
    wrap.setPointerCapture(e.pointerId);
    const move=ev=>{
      const r=wrap.getBoundingClientRect();
      const ratio=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
      inp.value=Math.round((min+ratio*(max-min))/st)*st;
      inp.dispatchEvent(new Event('input',{bubbles:true}));
      sync();
    };
    move(e);
    const up=()=>{wrap.removeEventListener('pointermove',move);wrap.removeEventListener('pointerup',up);};
    wrap.addEventListener('pointermove',move);wrap.addEventListener('pointerup',up);
  });
  SLIDER_META[k]={fmt:fmt,valEl:val,labEl:lab,i18nKey:i18nKey,inp:inp,row:row,wrap:wrap,sync:sync};
  requestAnimationFrame(sync);
}

/* ============================== 配置保存与导入 ============================== */
const CFG_VERSION=2;
const CFG_KEYS=['brand','text1','text2','fontScale','weight','anchor','margin','offX','offY',
'rotation','opacity','bgMode','blur','refrHeight','refrAmount','chromaOn','chromaI',
'bulge','wobble','lens','rimRef','edgeBlur','gGlow','highlight','tintA','tintC','radius',
'textColor','textGlow','textShadow','textGrad','textCol1','textCol2','fmt','quality','_useGlassEngine'];
function buildConfig(){
  const cfg={version:CFG_VERSION};
  for(const k of CFG_KEYS)cfg[k]=state[k];
  return cfg;
}
function sanitizeConfig(obj){
  if(!obj||typeof obj!=='object'||Array.isArray(obj))return null;
  const out={};
  for(const k of CFG_KEYS){
    if(!(k in obj))continue;
    const v=obj[k],def=DEFAULTS[k];
    if(typeof def==='number'){
      const n=typeof v==='string'?parseFloat(v):v;
      if(typeof n==='number'&&Number.isFinite(n))out[k]=n;
    }else if(typeof def==='boolean'){
      out[k]=!!v;
    }else if(typeof def==='string'){
      if(typeof v==='string')out[k]=v.slice(0,200);
    }
  }
  if(out.brand&&out.brand!=='none'&&out.brand!==CUSTOM_ID&&!BRANDS.some(b=>b.id===out.brand))out.brand='none';
  if(out.anchor&&!/^(top|middle|bottom)-(left|center|right)$/.test(out.anchor))out.anchor=DEFAULTS.anchor;
  if(![400,500,600,700,800].includes(out.weight))out.weight=DEFAULTS.weight;
  if(!['png','jpeg','webp'].includes(out.fmt))out.fmt='png';
  if(out.textColor&&!['auto','light','dark'].includes(out.textColor))out.textColor='auto';
  if(out.bgMode&&!['image','blurred','none'].includes(out.bgMode))out.bgMode='image';
  if(typeof out.textCol1!=='string'||!/^#[0-9a-fA-F]{6}$/.test(out.textCol1))out.textCol1=DEFAULTS.textCol1;
  if(typeof out.textCol2!=='string'||!/^#[0-9a-fA-F]{6}$/.test(out.textCol2))out.textCol2=DEFAULTS.textCol2;
  if(typeof out.tintC!=='string'||!/^#[0-9a-fA-F]{6}$/.test(out.tintC))out.tintC=DEFAULTS.tintC;
  return out;
}
function applyConfig(cfg){
  const clean=sanitizeConfig(cfg);
  if(!clean)return false;
  const wasEdited=state.text1Edited;
  state=Object.assign({},DEFAULTS,clean);
  state.text1Edited=wasEdited||!!clean.text1;
  state.text2Edited=!!clean.text2;
  return true;
}
function saveConfigLocal(){
  try{
    localStorage.setItem('lgwConfig',JSON.stringify(buildConfig()));
    return true;
  }catch(e){return false;}
}
function loadConfigLocal(){
  try{
    const raw=localStorage.getItem('lgwConfig');
    if(!raw)return false;
    return applyConfig(JSON.parse(raw));
  }catch(e){return false;}
}
function exportConfigFile(){
  const blob=new Blob([JSON.stringify(buildConfig(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const stamp=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  a.href=url;a.download='liquid-glass-config-'+stamp+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function importConfigFile(file){
  if(!file)return;
  if(window.FileReader){
    const r=new FileReader();
    r.onload=()=>{
      try{

        if(applyConfig(obj)){

  }
}

/* ===== 移动端按压反馈：pointer 事件驱动 + 原版 DampedDragAnimation 弹簧物理 =====
   为什么需要：移动浏览器默认不触发 CSS :active，光靠 CSS 按压态在手机上等于不存在。
   pointerdown/pointerup 在各平台都可靠触发，用它驱动 pressProgress 0→1→0。
   弹簧参数照抄压缩包 AndroidLiquidGlass-2.0.1 的 DampedDragAnimation：
     按下 spring(dampingRatio=1.0, stiffness=1000) —— 临界阻尼，快速到位无过冲
     松手 spring(dampingRatio=0.6, stiffness=250)  —— 欠阻尼，带过冲回弹
   缩放终点沿用原版 lerp(1f, 1.2f, pressProgress)；普通按钮取 1.12。 */
function bindPressSpring(){
  const SEL='.btn,.btn.primary,.seg,.tabbtn';
  const SKIP='#preview,.lgslider,input,select,textarea,a,label';
  const press=new Map();   // pointerId -> {el,x,v,target,amp,startX,startY,cancelled}
  let raf=null,last=0;
  const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function hitEl(t){
    if(!t||!t.closest)return null;
    if(t.closest(SKIP))return null;
    return t.closest(SEL);
  }
  function ampOf(el){return el.classList.contains('tabbtn')?1.2:1.12;}
  function paint(st){
    st.el.style.transform='scale('+(1+(st.amp-1)*st.x)+')';
    // 局部微光：只在触点位置画径向光晕，不是整个按钮变白
    st.el.style.background='radial-gradient(120px 120px at '+st.gx+'px '+st.gy+'px,rgba(255,255,255,'+(0.5*st.x).toFixed(3)+'),rgba(255,255,255,0) 70%)';
  }
  function clear(st){st.el.style.transform='';st.el.style.background='';}
  function tick(t){
    const now=(t==null?performance.now():t);
    const dt=last?Math.min((now-last)/1000,1/30):1/60;
    last=now;
    let alive=false;
    press.forEach((st,id)=>{
      if(st.cancelled){clear(st);press.delete(id);return;}
      const on=st.target===1;
      const zeta=on?1.0:0.6;                 // 按下临界阻尼 / 松手欠阻尼
      const k=on?1000:250;                   // 原版 stiffness
      const c=2*zeta*Math.sqrt(k);
      if(reduce){st.x=st.target;st.v=0;}
      else{
        const a=-k*(st.x-st.target)-c*st.v;
        st.v+=a*dt; st.x+=st.v*dt;
      }
      paint(st);
      const settled=Math.abs(st.x-st.target)<0.002&&Math.abs(st.v)<0.02;
      if(settled&&st.target===0){clear(st);press.delete(id);}
      else alive=true;
    });
    if(alive)raf=requestAnimationFrame(tick);
    else{raf=null;last=0;}
  }
  function ensureLoop(){if(raf===null){last=0;raf=requestAnimationFrame(tick);}}

  document.addEventListener('pointerdown',e=>{
    const el=hitEl(e.target); if(!el)return;
    const rc=el.getBoundingClientRect();
    press.set(e.pointerId,{el,x:0,v:0,target:1,amp:ampOf(el),
      gx:e.clientX-rc.left,gy:e.clientY-rc.top,      // 触点相对坐标，径向光晕用
      startX:e.clientX,startY:e.clientY,cancelled:false});
    ensureLoop();
  },{passive:true});

  document.addEventListener('pointermove',e=>{
    const st=press.get(e.pointerId); if(!st)return;
    // 往任何方向拖动（哪怕 1px）都立即回弹，符合"拖动回弹"
    if(Math.abs(e.clientX-st.startX)>1||Math.abs(e.clientY-st.startY)>1)st.cancelled=true;
  },{passive:true});

  document.addEventListener('pointerup',e=>{
    const st=press.get(e.pointerId); if(!st)return;
    if(st.cancelled){clear(st);press.delete(e.pointerId);return;}
    st.target=0; ensureLoop();               // 松手：弹簧回弹
  },{passive:true});

  document.addEventListener('pointercancel',e=>{
    const st=press.get(e.pointerId);
    if(st){clear(st);press.delete(e.pointerId);}
  },{passive:true});
}
try{bindPressSpring();}catch(e){console.warn('press spring init failed',e);}
</script>
